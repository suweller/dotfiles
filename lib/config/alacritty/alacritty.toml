[font]
# size = 64 # Presenterm
# size = 36 # McDipSize

# family = "ProggyClean Nerd Font Mono"
# size = 46 # McDipSize

# family = "FantasqueSansM Nerd Font Mono"
# size = 36 # McDipSize
size = 30 # Almost McDipSize - smallest bar at the bottom
# size = 24

# ✨
[font.normal]
family = "Inconsolata Nerd Font Mono"
style = "Regular"
[font.bold]
style = "Bold"
[font.italic]
style = "Italic"

[window]
blur = false
# decorations = "Full"
decorations = "Transparent"
decorations_theme_variant = "Dark"
# dynamic_padding = true
# opacity = 0.75
resize_increments = true
# startup_mode = "Fullscreen"
startup_mode = "SimpleFullscreen"

[general]
import = ["~/.local/state/alacritty/colors.toml"]
live_config_reload = true
